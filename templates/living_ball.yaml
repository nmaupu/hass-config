- light:
    - name: "Living ball"
      default_entity_id: light.living_ball_switch
      level: >
        {% if is_state('switch.living_ball','on') %}255{% else %}0{% endif %}
      state: >
        {{ is_state('switch.living_ball','on') }}
      icon: mdi:lightbulb
      turn_on:
        action: switch.turn_on
        target:
          entity_id: switch.living_ball
      turn_off:
        action: switch.turn_off
        target:
          entity_id: switch.living_ball
